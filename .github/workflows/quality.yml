name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, indica-anime-us]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript and ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify preinstalled FFmpeg toolchain
        run: |
          ffmpeg -version
          ffprobe -version
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Local worker and FFmpeg integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Production build
        run: npm run build
      - name: Install temporary browser test runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end workflow
        run: npx playwright test
